treg:()=>`${bk('Daftar Guru','tlogin')}<div class="card"><label for="n">NAMA</label><input id="n"><label for="e">EMAIL</label><input id="e" type="email"><label for="p">PASSWORD (min. 6)</label><input id="p" type="password"><div class="err" role="alert">${ERR}</div><button class="btn g" onclick="A.treg()">DAFTAR</button></div>`,
tdash:()=>{const st=TC.flatMap(c=>c.studs);return`<h2>TEACHER DASHBOARD</h2><div class="g2"><div class="st"><b>${TC.length}</b>Total kelas</div><div class="st"><b>${st.length}</b>Total siswa</div><div class="st"><b>${pc(st,s=>s.score)}</b>Rata-rata skor</div><div class="st"><b>${pc(st,prog)}%</b>Penyelesaian</div></div><h3>MY CLASSES</h3>${TC.map(c=>`<button class="nd" onclick="CL='${c.code}';A.go('tdet')"><span>🏫</span><div><b>${c.name}</b> ${c.active?'':'(nonaktif)'}<br>${c.studs.length} siswa · skor rata-rata ${pc(c.studs,s=>s.score)} · progress ${pc(c.studs,prog)}%</div></button>`).join('')||'<p class="mut">Belum ada kelas.</p>'}<button class="btn g" onclick="A.go('newc')">+ BUAT KELAS</button>`},
newc:()=>`${bk('Buat Kelas','tdash')}<div class="card"><label for="cn">NAMA KELAS</label><input id="cn" placeholder="XI IPA 1"><label for="cy">TAHUN AJARAN</label><input id="cy" placeholder="2026/2027"><label for="cd">DESKRIPSI (opsional)</label><input id="cd"><div class="err" role="alert">${ERR}</div><button class="btn g" onclick="A.newc()">BUAT KELAS</button></div>`,
tcls:()=>`<h2>Kelas Saya</h2>${VW.tdash().split('<h3>MY CLASSES</h3>')[1]}`,
tdet:()=>{const c=TC.find(x=>x.code==CL);if(!c)return VW.tdash();const s=c.studs,dn=s.filter(x=>prog(x)==100).length;return`${bk(c.name,'tdash')}<div class="card"><h3>CLASS CODE</h3><h2>${c.code}</h2><button class="btn s" onclick="A.copy('${c.code}')">📋 Salin</button><button class="btn s" onclick="A.share('${c.code}')">📤 Bagikan</button><button class="btn s" onclick="A.tog('${c.code}')">${c.active?'⛔ Nonaktifkan':'✅ Aktifkan'}</button></div><div class="g3"><div class="st"><b>${s.length}</b>Siswa</div><div class="st"><b>${s.filter(x=>prog(x)>0).length}</b>Sudah mulai</div><div class="st"><b>${dn}</b>Selesai</div><div class="st"><b>${pc(s,x=>x.score)}</b>Rata-rata skor</div></div><div class="card"><div class="tr h"><span>Nama</span><span>Karakter</span><span>Progress</span><span>Score</span><span>Status</span></div>${s.map((x,i)=>`<div class="tr" tabindex="0" onclick="CL='${c.code}';A.sd(${i})"><span>${x.name}</span><span>${CH[x.ch][0]}</span><span>${prog(x)}%</span><span>${x.score}</span><span>${prog(x)==100?'Completed':'In Progress'}</span></div>`).join('')||'<p class="mut">Belum ada siswa bergabung.</p>'}</div>`},
tsd:()=>{const c=TC.find(x=>x.code==CL),s=c.studs[SD];return`${bk(s.name,'tdet')}<div class="card"><p>${s.cls} · ${CH[s.ch][0]} (${CH[s.ch][1]})</p><div class="g3"><div class="st"><b>${s.score}</b>Skor</div><div class="st"><b>${s.xp}</b>XP</div><div class="st"><b>${prog(s)}%</b>Progress</div><div class="st"><b>${acc(s)}%</b>Akurasi</div><div class="st"><b>${s.hu}</b>Hint</div></div></div><div class="card"><h3>CASE PERFORMANCE</h3>${[1,2,3,4,5,6,7,8].map(n=>`<p class="mut">${NM[n]}: ${s.cs[n]?s.cs[n].sc+'/'+s.cs[n].mx+' · '+s.cs[n].dt:'—'}</p>`).join('')}<h3>CONCEPT MASTERY</h3>${mast([s]).map(m=>`<p class="mut">${m[0]} ${m[1]}%</p>${bar(m[1])}`).join('')}<h3>MISTAKES</h3>${Object.entries(s.er||{}).map(([k,v])=>`<p class="mut">${k.split('|').join(': ')} (${v}×)</p>`).join('')||'<p class="mut">Belum ada.</p>'}</div>`},
tana:()=>{const c=TC.find(x=>x.code==CL)||TC[0];if(!c)return'<h2>Analytics</h2><p class="mut">Buat kelas terlebih dahulu.</p>';CL=c.code;const s=c.studs,sc=s.map(x=>x.score),e=errs(s);return`<h2>ANALYTICS</h2><select aria-label="Pilih kelas" onchange="CL=this.value;A.go('tana')">${TC.map(k=>`<option value="${k.code}" ${k.code==CL?'selected':''}>${k.name}</option>`).join('')}</select><div class="g3"><div class="st"><b>${s.length}</b>Total</div><div class="st"><b>${s.filter(x=>prog(x)==100).length}</b>Selesai</div><div class="st"><b>${s.filter(x=>prog(x)<100).length}</b>Berjalan</div><div class="st"><b>${pc(s,x=>x.score)}</b>Rata-rata</div><div class="st"><b>${sc.length?Math.max(...sc):0}</b>Tertinggi</div><div class="st"><b>${sc.length?Math.min(...sc):0}</b>Terendah</div></div><div class="card"><h3>CONCEPT MASTERY</h3>${mast(s).map(m=>`<div class="row"><span>${m[0]}</span><b>${m[1]}%</b></div>${bar(m[1])}<br>`).join('')}</div><div class="card"><h3>COMMON ERRORS</h3>${e.map(([k,v,p],i)=>`<button class="opt" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><span><b>${k[0]}</b><br>${p}% siswa ${k[1]}</span></button><p class="mut" hidden>${v.join(', ')}</p>`).join('')||'<p class="mut">Belum ada data.</p>'}</div><div class="card"><h3>EXPORT RESULTS</h3><button class="btn s" onclick="A.exp('csv')">CSV</button><button class="btn s" onclick="A.exp('xls')">Excel</button><button class="btn s" onclick="A.exp('pdf')">PDF</button></div>`},
tprof:()=>`<h2>Profil Guru</h2><div class="card"><p>👨‍🏫 ${S.name}</p>${VW.set()}<button class="btn" onclick="A.out()">KELUAR</button></div>`,
set:()=>`<button class="btn s" onclick="A.opt('snd')">🔊 Sound: ${OPT.snd?'ON':'OFF'}</button><button class="btn s" onclick="A.opt('rm')">🎞️ Reduce Motion: ${OPT.rm?'ON':'OFF'}</button>`,
join:()=>`${bk('Join Class','land')}<div class="card"><label for="cc">MASUKKAN KODE KELAS</label><input id="cc" placeholder="THR-XI1-7K4P" autocapitalize="characters"><div class="err" role="alert">${ERR}</div><button class="btn or" onclick="A.join()">GABUNG KELAS</button></div>`,
prof0:()=>`<h2>Student Profile</h2><div class="card"><label for="sn">NAMA LENGKAP</label><input id="sn"><label>KELAS</label><input value="${S.cn}" readonly><h3>PILIH KARAKTER</h3><div class="g3" role="radiogroup">${CH.map((c,i)=>`<button class="ch ${i==CHS?'a':''}" role="radio" aria-checked="${i==CHS}" onclick="A.chs(${i})"><span>${c[2]}</span><b>${c[0]}</b><br>${c[1]}</button>`).join('')}</div><p class="mut">Karakter hanya identitas visual, tanpa keuntungan akademik.</p><div class="err" role="alert">${ERR}</div><button class="btn g" onclick="A.begin()">MULAI INVESTIGASI</button></div>`,
home:()=>{const p=prog(ST),cur=ST.cur;return`<div class="hero" style="text-align:left"><h2>WELCOME, DETECTIVE!</h2></div><div class="card"><div class="row"><div><b>${ST.name}</b><br><span class="mut">${ST.cls} · ${CH[ST.ch][2]} ${CH[ST.ch][0]}</span></div><div class="pill">${rank(ST.xp)}</div></div><div class="g3" style="margin:12px 0"><div class="st"><b>${ST.xp}</b>XP</div><div class="st"><b>${ST.score}</b>Score</div><div class="st"><b>${Object.keys(ST.cs).length}/8</b>Cases</div></div>${bar(p)}<p class="mut">Progress ${p}%</p></div><button class="btn g" onclick="A.cont()">▶ CONTINUE INVESTIGATION</button><div class="g2"><button class="btn" onclick="A.go('cases')">🗺️ Case Map</button><button class="btn" onclick="A.go('evb')">📌 Evidence Board</button><button class="btn" onclick="A.go('nb')">📓 Detective Notebook</button><button class="btn" onclick="A.go('prof')">🏅 Achievements</button></div><button class="btn" onclick="A.go('rep')">📄 My Report</button>`},
cases:()=>`<h2>CASE MAP</h2>${[1,2,3,4,5,6,7,8].map(n=>{const u=unlocked(n),d=ST.cs[n];return`<button class="nd ${u?'':'l'} ${d?'dn':''}" ${u?'':'disabled'} onclick="${ST.cur&&ST.cur.n==n?"A.go('case')":`A.start(${n})`}"><span>${d?'✅':u?'🔍':'🔒'}</span><div><small class="mut">${n==8?'FINAL':'CASE 0'+n}</small><br><b>${NM[n]}</b><br><small class="mut">${n==8?'Integrasi semua konsep':TP[n-1]}${d?' · '+d.sc+'/'+d.mx:''}${ST.cur&&ST.cur.n==n?' · lanjutkan':''}</small></div></button>`}).join('')}`,
evb:()=>`<h2>EVIDENCE BOARD</h2><p class="mut">${ST.evl.length} bukti terkumpul</p><div class="g2">${ST.evl.map(e=>`<div class="ev f"><small>CASE 0${e.n}</small><br>${e.i} <b>${e.t}</b><br><small>${e.d}</small></div>`).join('')||'<p class="mut">Belum ada bukti. Mulai investigasi!</p>'}</div>`,
nb:()=>`<h2>DETECTIVE NOTEBOOK</h2>${Object.keys(ST.nb).map(n=>{const b=ST.nb[n];return`<div class="card"><h3>CASE 0${n}: ${NM[n]}</h3><p class="mut">EVIDENCE: ${ST.evl.filter(e=>e.n==n).map(e=>e.t+' ('+e.d+')').join('; ')||'-'}</p><label for="h${n}">HYPOTHESIS</label><textarea id="h${n}" rows="2" onchange="A.nbs(${n},'h',this.value)">${b.h||''}</textarea><label for="a${n}">ANALYSIS</label><textarea id="a${n}" rows="2" onchange="A.nbs(${n},'a',this.value)">${b.a||''}</textarea><label for="c${n}">CONCLUSION</label><textarea id="c${n}" rows="2" onchange="A.nbs(${n},'c',this.value)">${b.c||''}</textarea></div>`}).join('')||'<p class="mut">Catatan akan muncul setelah kamu memulai kasus. Tersimpan otomatis.</p>'}`,
prof:()=>`<h2>PROFILE</h2><div class="card"><p>${CH[ST.ch][2]} <b>${ST.name}</b> · ${ST.cls}</p><p>Rank: <b>${rank(ST.xp)}</b> · XP ${ST.xp}</p><h3>ACHIEVEMENTS</h3>${AC.map(a=>`<p>${a[3](ST)?a[0]+' <b>'+a[1]+'</b> — terbuka ✔':'🔒 <span class="mut">'+a[1]+' — '+a[2]+'</span>'}</p>`).join('')}${VW.set()}<button class="btn" onclick="A.out()">KELUAR</button></div>`,
rep:()=>`${bk('My Report','home')}<div class="card"><h3>THERMO DETECTIVE REPORT</h3><p>Nama: ${ST.name}<br>Kelas: ${ST.cls}<br>Karakter: ${CH[ST.ch][0]}<br>Kasus selesai: ${Object.keys(ST.cs).length} / 8<br>Skor: ${ST.score} · XP: ${ST.xp}<br>Akurasi: ${acc(ST)}%<br>Evidence: ${ST.ev} · Eksperimen: ${ST.ex} · Hint: ${ST.hu}<br>Rank: <b>${rank(ST.xp)}</b></p>${[1,2,3,4,5,6,7,8].map(n=>`<p class="mut">${NM[n]}: ${ST.cs[n]?ST.cs[n].sc+'/'+ST.cs[n].mx:'—'}</p>`).join('')}<button class="btn g" onclick="A.rep()">DOWNLOAD PDF REPORT</button><p class="mut">Pilih “Simpan sebagai PDF” pada dialog cetak.</p></div>`,
case:()=>{const c=ST.cur;if(!c)return VW.cases();const d=c.d,n=c.n,q=d.qs[c.i],hd=`<div class="top"><button class="bk" aria-label="Kembali ke peta" onclick="A.go('cases')">‹</button><div><small class="mut">${n==8?'FINAL CASE':'CASE FILE 0'+n}</small><br><b>${NM[n]}</b></div><div class="pill">⭐ ${ST.score}</div></div>`;
if(c.st=='intro')return`${hd}<div class="card"><h3>CASE FILE</h3><p>${d.story}</p><p class="mut">Temukan konsepnya lewat bukti — jangan menebak!</p></div><button class="btn g" onclick="A.stg('ev')">INVESTIGATE ›</button>`;
if(c.st=='ev'){const all=c.f.length==3;return`${hd}<h3>EVIDENCE FOUND ${c.f.length}/3</h3><div class="g3">${d.ev.map((e,i)=>c.f.includes(i)?`<div class="ev f">${e.i} <b>${e.t}</b><br>${e.d}</div>`:`<button class="ev" onclick="A.find(${i})" aria-label="Ambil bukti ${i+1}">🔍<br>Ketuk untuk mencari bukti</button>`).join('')}</div>${all?`<button class="btn g" onclick="A.stg('${d.exp&&!c.ex?'exp':'q'}')">${d.exp&&!c.ex?'LAKUKAN EKSPERIMEN ›':'ANALYZE ›'}</button>`:''}`}
if(c.st=='exp'){const e=d.exp,t=c.ex?e.b:e.a;return`${hd}<div class="card"><h3>VIRTUAL EXPERIMENT</h3><p class="mut">Kalorimeter berisi ${e.m} g larutan. Campurkan zat dan amati termometer.</p><svg viewBox="0 0 220 200" style="width:100%;max-width:300px" role="img" aria-label="Kalorimeter dan termometer"><rect x="30" y="60" width="110" height="120" rx="12" fill="none" stroke="#7dd3fc" stroke-width="3"/><rect x="33" y="95" width="104" height="82" rx="8" fill="${c.ex?(e.b>e.a?'#f59e0b':'#38bdf8'):'#22d3ee'}" opacity=".55"/><rect x="165" y="40" width="14" height="130" rx="7" fill="none" stroke="#fff" stroke-width="2"/><rect id="hg" x="168" y="${170-Math.max(4,(t-15)*4)}" width="8" height="${Math.max(4,(t-15)*4)}" fill="#f87171"/><circle cx="172" cy="178" r="11" fill="#f87171"/></svg><div class="pill" id="tt" style="font-size:22px;text-align:center">${t.toFixed(1)} °C</div><br>${c.ex==0?'<button class="btn g" onclick="A.mix(this.disabled=true)">CAMPURKAN</button>':c.ex==1?`<p>Suhu awal ${e.a}°C → akhir ${e.b}°C.</p><button class="btn g" onclick="A.rec()">📝 CATAT DATA</button>`:''}</div>`}
if(c.st=='end'){const r=ST.cs[n];return`${hd}<div class="card" style="text-align:center"><h2>CASE CLOSED</h2><p>Skor kasus: <b>${r.sc} / ${r.mx}</b><br>Benar ${r.ok}/${r.tot} · Hint ${r.hu}${r.hu?'':' · Bonus tanpa hint +10 🕵️'}</p>${c.nw?'<p class="pill">🏅 ACHIEVEMENT UNLOCKED!</p>':''}<p>Rank: <b>${rank(ST.xp)}</b></p></div><button class="btn g" onclick="A.leave()">KEMBALI KE CASE MAP</button>${n==8?'<button class="btn" onclick="A.go(\'rep\')">LIHAT LAPORAN AKHIR</button>':''}`}
const r=c.r,hc=[5,10,15];let ctl='';
if(q.t=='mc')ctl=q.o.map((o,i)=>`<button class="opt" ${r?'disabled':''} onclick="A.ans(${i})"><b>${'ABCD'[i]}</b>${o}${r&&i==q.a?' ✔':''}</button>`).join('');
if(q.t=='num')ctl=r?'':`<input id="nv" inputmode="decimal" aria-label="Jawaban (${q.u})" placeholder="Jawaban (${q.u})"><button class="btn or" onclick="A.sub()">PERIKSA</button>`;
if(q.t=='ord')ctl=`<p class="mut">Ketuk langkah sesuai urutan benar:</p>${c.sel.map((j,k)=>`<div class="ev f" style="min-height:0;margin:4px 0">${k+1}. ${q.o[j]}</div>`).join('')}${r?'':q.o.map((o,j)=>c.sel.includes(j)?'':`<button class="opt" onclick="A.pick(${j})">${o}</button>`).join('')+(c.sel.length?'<button class="btn s" onclick="A.rst()">↺ Ulang</button>':'')}`;
return`${hd}<div class="dots">${d.qs.map((_,i)=>`<i class="${i<c.i||(i==c.i&&r)?'d':''}"></i>`).join('')}</div><div class="card"><small class="mut">${q.tp} · ${q.t=='ord'?'WHY?':q.t=='num'?'ANALYZE':'INVESTIGATE'} · ${q.s} poin</small>${q.dg?dia(...q.dg):''}<p>${q.q}</p>${ctl}<div class="err" role="alert">${ERR}</div>
${r?`<div class="fb ${r.ok?'ok':'no'}">${r.ok?'✔ BENAR · +'+r.p:'✘ BELUM TEPAT · +0'}</div>${r.ok?'':`<p><b>Jawaban:</b> ${q.t=='mc'?q.o[q.a]:q.t=='num'?q.a+' '+q.u:q.a.map((x,i)=>(i+1)+'. '+x).join(' → ')}</p>`}<p>${q.w}</p><button class="btn g" onclick="A.next()">${c.i+1<d.qs.length?'NEXT CLUE ›':'CLOSE CASE ›'}</button>`:`${[...Array(c.hq)].map((_,i)=>`<p class="mut">💡 Hint ${i+1}: ${q.h[i]}</p>`).join('')}${c.hq<3?`<button class="btn s" onclick="A.hint()">💡 Hint ${c.hq+1} (−${hc[c.hq]})</button>`:''}`}</div>`}
};
function render(){const a=$('#app'),st=['home','cases','evb','nb','prof','case','rep'].includes(V),th=V[0]=='t'&&V!='tlogin'&&V!='treg',pg=th||st;document.body.className=OPT.rm?'rm':'';a.className=th?'w':'';a.innerHTML=VW[V]()+FOOT;document.querySelectorAll('nav').forEach(x=>x.remove());if(pg){const it=th?[['tdash','📊','Dashboard'],['tcls','🏫','Classes'],['tana','📈','Analytics'],['tprof','👤','Profile']]:[['home','🏠','Home'],['cases','🗺️','Cases'],['evb','📌','Evidence'],['nb','📓','Notebook'],['prof','👤','Profile']],cur=V=='case'||V=='rep'?'cases':V=='tdet'||V=='tsd'||V=='newc'?'tcls':V;const n=document.createElement('nav');n.className=th?'w':'';n.innerHTML='<div>'+it.map(x=>`<button class="${x[0]==cur?'a':''}" onclick="A.go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')+'</div>';document.body.appendChild(n)}}
(async()=>{try{await api({op:'ping'});NET=true}catch(e){}try{if(window.claude&&claude.use)db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),4000))])}catch(e){}await resume();if(V=='tdash')await loadT();render()})();
</script></body></html>
